<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https: http:; connect-src 'self' https: http: ws: wss:; img-src 'self' file: data: https: http: blob:; media-src 'self' https: http: blob:; font-src 'self' data: https:; frame-src 'self' https: http:;">
  <title>TABuddy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #f5f5f5;
    }

    ::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      border-radius: 8px;
      overflow: hidden;
    }

    #titlebar {
      width: 100%;
      height: 32px;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      position: relative;
      z-index: 9999;
      -webkit-app-region: drag;
    }

    #titlebar.dark {
      background: rgba(30, 30, 30, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    #titlebar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-left: 12px;
      min-width: 180px;
      -webkit-app-region: drag;
    }

    #titlebar-icon {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
    }

    #titlebar-text {
      font-size: 12px;
      color: rgba(0, 0, 0, 0.75);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    #titlebar-center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-app-region: drag;
    }

    #titlebar-title {
      font-size: 11px;
      color: rgba(0, 0, 0, 0.45);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    #titlebar-right {
      display: flex;
      align-items: center;
      height: 100%;
      -webkit-app-region: no-drag;
    }

    .titlebar-btn {
      width: 46px;
      height: 100%;
      border: none;
      background: transparent;
      color: rgba(0, 0, 0, 0.55);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease;
      -webkit-app-region: no-drag;
      font-size: 10px;
      outline: none;
    }

    .titlebar-btn svg {
      width: 16px;
      height: 16px;
      stroke-width: 1.5;
    }

    .titlebar-btn:hover {
      background: rgba(0, 0, 0, 0.06);
    }

    .titlebar-btn:active {
      background: rgba(0, 0, 0, 0.04);
    }

    .titlebar-btn.close:hover {
      background: #e81123;
      color: #fff;
    }

    .titlebar-btn.close:active {
      background: #bf0f1d;
      color: #fff;
    }

    .titlebar-btn.minimize, .titlebar-btn.maximize {
      font-size: 18px;
      line-height: 1;
    }

    .titlebar-btn svg[data-type="restore"] {
      display: none;
    }

    #main-content {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    webview {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
      display: flex;
    }

    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e0e0e0;
      border-top-color: #4a90d9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loading-text {
      margin-top: 16px;
      font-size: 13px;
      color: #888;
    }

    #offline-overlay {
      position: absolute;
      top: 32px;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(245, 245, 245, 0.95);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 11;
    }

    #offline-overlay.show {
      display: flex;
    }

    #offline-icon {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.4;
    }

    #offline-text {
      font-size: 15px;
      color: #666;
      margin-bottom: 8px;
    }

    #offline-subtext {
      font-size: 12px;
      color: #999;
    }

    #retry-btn {
      margin-top: 16px;
      padding: 8px 24px;
      background: #4a90d9;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #retry-btn:hover {
      background: #357abd;
    }

    @media (prefers-color-scheme: dark) {
      #loading-overlay, #offline-overlay {
        background: #1a1a1a;
      }

      #loading-text, #offline-text, #offline-subtext {
        color: #999;
      }

      #loading-spinner {
        border-color: #333;
        border-top-color: #5a9ee6;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="titlebar">
      <div id="titlebar-left">
        <img id="titlebar-icon" src="" alt="logo">
        <span id="titlebar-text">TABuddy</span>
      </div>
      <div id="titlebar-center">
        <span id="titlebar-title">助教助手</span>
      </div>
      <div id="titlebar-right">
        <button class="titlebar-btn minimize" id="btn-minimize" title="最小化">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="titlebar-btn maximize" id="btn-maximize" title="最大化">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" data-type="maximize"><rect x="5" y="5" width="14" height="14" rx="1"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" data-type="restore"><rect x="7" y="9" width="10" height="10" rx="1"/><path d="M9 9V7a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2"/></svg>
        </button>
        <button class="titlebar-btn close" id="btn-close" title="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
        </button>
      </div>
    </div>
    <div id="main-content">
      <div id="loading-overlay">
        <div id="loading-spinner"></div>
        <div id="loading-text">加载中...</div>
      </div>
      <div id="offline-overlay">
        <svg id="offline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.56 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
        <div id="offline-text">无法连接到网络</div>
        <div id="offline-subtext">请检查网络连接后重试</div>
        <button id="retry-btn">重新连接</button>
      </div>
      <webview
        id="main-webview"
        allowpopups
        disablewebsecurity
        webpreferences="contextIsolation=1"
        style="width:100%;height:100%"
      ></webview>
    </div>
  </div>

  <script>
    const webview = document.getElementById('main-webview')
    const loadingOverlay = document.getElementById('loading-overlay')
    const offlineOverlay = document.getElementById('offline-overlay')
    const titlebarText = document.getElementById('titlebar-text')
    const titlebarTitle = document.getElementById('titlebar-title')
    const titlebarIcon = document.getElementById('titlebar-icon')

    const appConfig = window.electronApp.getConfig()

    titlebarText.textContent = appConfig.appNameCn
    titlebarTitle.textContent = appConfig.appNameCn

    if (appConfig.appName !== 'TABuddy' || appConfig.appNameCn !== '助教助手') {
      document.title = appConfig.appNameCn || appConfig.appName
    }

    if (appConfig.webviewPreload) {
      webview.setAttribute('preload', appConfig.webviewPreload)
    }

    if (appConfig.localIconPath) {
      titlebarIcon.src = appConfig.localIconPath
    } else {
      titlebarIcon.style.display = 'none'
    }

    webview.addEventListener('did-start-loading', () => {
      loadingOverlay.classList.remove('hidden')
      offlineOverlay.classList.remove('show')
    })

    webview.addEventListener('did-stop-loading', () => {
      loadingOverlay.classList.add('hidden')
    })

    webview.addEventListener('did-finish-load', () => {
      loadingOverlay.classList.add('hidden')
      offlineOverlay.classList.remove('show')

      webview.executeJavaScript(`
        (function() {
          try {
            document.title !== '' && (document.title = document.title || '${appConfig.appNameCn}');
          } catch(e) {}
        })()
      `).catch(() => {})

      setTimeout(() => {
        webview.executeJavaScript(`
          (function() {
            try {
              const title = document.title || '';
              if (title) {
                window.__electronTitle = title;
              }
            } catch(e) {}
          })()
        `).catch(() => {})
      }, 1000)
    })

    webview.addEventListener('did-fail-load', (e) => {
      if (e.errorCode !== -3) {
        loadingOverlay.classList.add('hidden')
        offlineOverlay.classList.add('show')
      }
    })

    webview.addEventListener('page-title-updated', (e) => {
      const title = e.title || appConfig.appNameCn
      titlebarTitle.textContent = title
      document.title = title
    })

    webview.addEventListener('console-message', (e) => {
      if (e.level >= 2) {
        console.log('[webview]', e.message)
      }
    })

    webview.addEventListener('new-window', (e) => {
      const url = e.url
      if (url && !url.startsWith(appConfig.targetUrl)) {
        e.preventDefault()
        window.electronApp.openExternalLink(url)
      }
    })

    function loadTargetUrl() {
      const url = appConfig.targetUrl
      if (url && url !== '' && url.startsWith('http')) {
        webview.src = url
      } else {
        webview.src = 'about:blank'
        loadingOverlay.classList.add('hidden')
        offlineOverlay.classList.add('show')
        document.getElementById('offline-text').textContent = '未配置目标网址'
        document.getElementById('offline-subtext').textContent = '请在 electron/config.js 中设置 TARGET_URL'
      }
    }

    loadTargetUrl()

    document.getElementById('retry-btn').addEventListener('click', () => {
      loadingOverlay.classList.remove('hidden')
      offlineOverlay.classList.remove('show')
      webview.reload()
    })

    webview.addEventListener('ipc-message', (event) => {
      if (event.channel === 'notification') {
        try {
          const data = JSON.parse(event.args[0] || '{}')
          if (data.title && data.body) {
            window.electronApp.showDesktopNotification(data.title, data.body, data.link || '')
          }
        } catch (e) {
          console.error('Notification parse error:', e)
        }
      }
    })

    document.getElementById('btn-minimize').addEventListener('click', () => {
      window.electronApp.minimizeWindow()
    })

    document.getElementById('btn-maximize').addEventListener('click', () => {
      window.electronApp.maximizeWindow()
      updateMaximizeButton()
    })

    document.getElementById('btn-close').addEventListener('click', () => {
      window.electronApp.closeWindow()
    })

    function updateMaximizeButton() {
      window.electronApp.isMaximized().then((maximized) => {
        const maxBtn = document.getElementById('btn-maximize')
        const maxSvg = maxBtn.querySelector('svg[data-type="maximize"]')
        const restoreSvg = maxBtn.querySelector('svg[data-type="restore"]')
        if (maxSvg && restoreSvg) {
          maxSvg.style.display = maximized ? 'none' : 'block'
          restoreSvg.style.display = maximized ? 'block' : 'none'
        }
        maxBtn.title = maximized ? '还原' : '最大化'
      })
    }

    window.addEventListener('resize', () => {
      updateMaximizeButton()
    })

    document.addEventListener('DOMContentLoaded', () => {
      updateMaximizeButton()
    })

    setTimeout(() => updateMaximizeButton(), 500)
  </script>
</body>
</html>
